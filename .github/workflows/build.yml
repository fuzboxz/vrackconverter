name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Always run on PRs (including forks), and only on tags for the canonical repo
    # Skip on main branch pushes since PRs are already tested before merge
    if: github.event_name == 'pull_request' || (github.repository == 'fuzboxz/vrackconverter' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # PRs get isolated cache scope, never shared with main branch
          key: go-${{ runner.os }}-${{ github.event_name }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-push-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build CLI binary (required for integration tests)
        run: go build -ldflags "-X main.Version=dev" -o vrackconverter-cli ./cmd/vrackconverter/

      - name: Run tests
        run: go test -race ./cmd/vrackconverter ./internal/converter/...

      - name: Run E2E tests (only show failures)
        if: failure()
        run: go test -v ./cmd/vrackconverter -run TestCLI

  # Build GUI and CLI for all platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    needs: test
    # Only run on canonical repo for releases
    if: github.repository == 'fuzboxz/vrackconverter' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          # macOS builds GUI (Apple Silicon only)
          - os: macOS
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            build_gui: true
          # Linux builds GUI + all CLI variants
          - os: Linux
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            build_gui: true
            build_all_cli: true
          # Windows builds GUI
          - os: Windows
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            build_gui: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Download dependencies
        run: go mod download

      # Install dependencies for Linux GUI
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev

      # Build GUI
      - name: Build GUI
        if: matrix.build_gui
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            go build -ldflags "-X main.Version=$VERSION" -o vrackconverter ./cmd/vrackconverter-gui/
            ./scripts/macos-package.sh vrackconverter "${VERSION#v}"
            ARCHIVE_NAME="vrackconverter-gui-${{ matrix.goos }}-${{ matrix.goarch }}.app.tar.gz"
            tar -czf "$ARCHIVE_NAME" vrackconverter.app
            echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            go build -ldflags "-X main.Version=$VERSION" -o vrackconverter ./cmd/vrackconverter-gui/
            ARCHIVE_NAME="vrackconverter-gui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar -czf "$ARCHIVE_NAME" vrackconverter
            echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
          else
            # Windows
            go build -ldflags "-X main.Version=$VERSION" -o vrackconverter.exe ./cmd/vrackconverter-gui/
            ARCHIVE_NAME="vrackconverter-gui-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
            7z a -tzip "$ARCHIVE_NAME" vrackconverter.exe
            echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
          fi

      # Build all CLI variants (from Linux runner)
      - name: Build all CLI variants
        if: matrix.build_all_cli
        shell: bash
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          # linux/amd64
          go build -ldflags "-X main.Version=$VERSION" -o vrackconverter ./cmd/vrackconverter/
          tar -czf vrackconverter-linux-amd64.tar.gz vrackconverter
          # linux/arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o vrackconverter ./cmd/vrackconverter/
          tar -czf vrackconverter-linux-arm64.tar.gz vrackconverter
          # darwin/amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o vrackconverter ./cmd/vrackconverter/
          tar -czf vrackconverter-darwin-amd64.tar.gz vrackconverter
          # darwin/arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o vrackconverter ./cmd/vrackconverter/
          tar -czf vrackconverter-darwin-arm64.tar.gz vrackconverter
          # windows/amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=$VERSION" -o vrackconverter.exe ./cmd/vrackconverter/
          zip -q vrackconverter-windows-amd64.zip vrackconverter.exe
          # windows/arm64
          GOOS=windows GOARCH=arm64 go build -ldflags "-X main.Version=$VERSION" -o vrackconverter.exe ./cmd/vrackconverter/
          zip -q vrackconverter-windows-arm64.zip vrackconverter.exe

      - name: Upload GUI artifacts
        if: matrix.build_gui
        uses: actions/upload-artifact@v4
        with:
          name: vrackconverter-gui-${{ matrix.os }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 90

      - name: Upload CLI artifacts
        if: matrix.build_all_cli
        uses: actions/upload-artifact@v4
        with:
          name: vrackconverter-cli-all
          path: |
            vrackconverter-linux-*.tar.gz
            vrackconverter-darwin-*.tar.gz
            vrackconverter-windows-*.zip
          retention-days: 90

  release:
    name: Release
    runs-on: ubuntu-latest
    # Only run on canonical repo tags
    if: github.repository == 'fuzboxz/vrackconverter' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 10

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare checksums
        run: |
          cd artifacts
          # Generate checksums for all archive files
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; | sort > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          NOTES_FILE: ${{ runner.temp }}/release-notes.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## vRackConverter ${{ github.ref_name }}" > "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "### What's Changed" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges | grep -vi 'claude' >> "$NOTES_FILE" || true
          else
            echo "- Initial release" >> "$NOTES_FILE"
          fi
          echo "" >> "$NOTES_FILE"
          echo "### Downloads" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "**CLI** (`vrackconverter`): Command-line interface for automation and scripting" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "**GUI** (`vrackconverter-gui`): Desktop application with drag-and-drop interface" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "Choose the appropriate file for your platform:" >> "$NOTES_FILE"
          echo "- macOS: `vrackconverter-gui-darwin-*.app.tar.gz` (GUI) or `vrackconverter-darwin-*.tar.gz` (CLI)" >> "$NOTES_FILE"
          echo "- Linux: `vrackconverter-gui-linux-*.tar.gz` (GUI) or `vrackconverter-linux-*.tar.gz` (CLI)" >> "$NOTES_FILE"
          echo "- Windows: `vrackconverter-gui-windows-*.zip` (GUI) or `vrackconverter-windows-*.zip` (CLI)" >> "$NOTES_FILE"

          cat "$NOTES_FILE"

          # Detect pre-release tags (contain beta, rc, or alpha)
          if [[ "${{ github.ref_name }}" =~ -(beta|rc|alpha) ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          gh release create '${{ github.ref_name }}' \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG \
            -- \
            artifacts/**/*.tar.gz \
            artifacts/**/*.zip \
            artifacts/checksums.txt
        shell: bash
